name: 中转下载 Ollama 模型
on:
  workflow_dispatch:
    inputs:
      ollama_model:
        description: 'Ollama 模型名'
        required: true
        default: 'qwen3:32b'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium 2>/dev/null || true
          df -h /

      - name: 安装 Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: 拉取模型
        run: |
          ollama pull ${{ inputs.ollama_model }}
          ollama list

      - name: 导出模型为 GGUF 文件
        run: |
          # 模型 blob 是 GGUF 格式，直接复制出来
          MODEL_DIR="/usr/share/ollama/.ollama/models"
          mkdir -p gguf
          # 最大的 blob 就是模型文件
          find "$MODEL_DIR/blobs" -type f -size +1G -exec cp {} gguf/qwen3.gguf \;
          ls -lh gguf/
          du -sh gguf/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-model
          path: gguf/qwen3.gguf
          retention-days: 7
          compression-level: 0

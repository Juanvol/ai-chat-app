# 境外 Runner 拉取 Ollama 模型 → 分片上传 Release → 国内下载合并
name: 中转下载 Ollama 模型

on:
  workflow_dispatch:
    inputs:
      ollama_model:
        description: 'Ollama 模型名（如 qwen3:32b）'
        required: true
        default: 'qwen3:32b'
      local_name:
        description: '本地模型名（如 qwen3-local）'
        required: true
        default: 'qwen3-local'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 释放磁盘空间（Runner 默认 14G，需扩容）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/graalvm /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 安装 Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: 拉取模型
        run: |
          ollama pull ${{ inputs.ollama_model }}
          ollama list

      - name: 打包模型目录
        run: |
          tar -czf - -C ~/.ollama/models . | split -d -b 1900M - parts/model.tar.gz.part
          ls -lh parts/

      - name: 生成 Windows 还原脚本
        run: |
          cat > restore.bat << 'BAT'
          @echo off
          setlocal enabledelayedexpansion
          set NAME=%1
          echo [1/3] 合并分片...
          copy /b parts\model.tar.gz.part.* model.tar.gz
          echo [2/3] 解压到 F:\OllamaModels...
          mkdir F:\OllamaModels 2>nul
          tar -xzf model.tar.gz -C F:\OllamaModels
          echo [3/3] 验证...
          ollama list
          echo 完成!
          BAT

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ollama-${{ inputs.local_name }}-${{ github.run_id }}
          name: "Ollama 模型: ${{ inputs.ollama_model }}"
          body: |
            ## 使用方法

            1. 下载所有 `model.tar.gz.part.*` 和 `restore.bat`
            2. 把所有文件放到同一个目录
            3. **Windows**: 双击 `restore.bat`
            4. 完成后 `ollama list` 确认

            ## 模型信息
            - Ollama 原名: `${{ inputs.ollama_model }}`
            - 本地名: `${{ inputs.local_name }}`
          files: |
            parts/*
            restore.bat
